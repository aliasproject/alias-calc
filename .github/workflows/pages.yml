# Publishes site/ to GitHub Pages (aliasproject.github.io/alias-calc) when
# it changes on main. The site is static files with no build step; its
# tokens.css comes from design/build, and the design tokens workflow checks
# that it's up to date.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# One deployment at a time; a newer push waits rather than cancelling one
# that's halfway out.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish the website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
