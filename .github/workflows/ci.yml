# Runs on the org's self-hosted home runners (shared with other
# repositories: one VM, one Docker daemon). Their host has no Rust and no
# sudo, so the job runs in a container where it is root and can
# apt-install what it needs. The runner runs as uid 1001 and cleans the
# workspace and its temp directory before the next job; it can't remove
# what root left there, so the job ends by handing both back.
#
# No test opens a window.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR's runs share a group, so a new push cancels the one it supersedes.
# Each push to main has a group of its own, so every commit gets a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job runs PR code as root on shared runners: its token reads only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEBIAN_FRONTEND: noninteractive
  LANG: C.UTF-8

jobs:
  check:
    name: fmt, clippy, tests, release build
    runs-on: [self-hosted, home]
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      # git before checkout, or checkout falls back to a tarball; a C
      # compiler for the linker; libxkbcommon for keyboard layouts (the
      # Wayland client is pure Rust, so libwayland isn't needed).
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libxkbcommon-dev python3 >/dev/null
      - uses: actions/checkout@v4
      # A clean Rust each time: an earlier job's half-installed rustup in
      # the shared $HOME breaks the install.
      - name: Start from a clean home
        run: rm -rf "$HOME/.cargo" "$HOME/.rustup"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      # The screen reader library as it's packaged: its own size-first profile.
      - run: cargo build --profile release-a11y --locked -p alias-calc-a11y
      # aliasOS also runs on Apple Silicon: c_char is u8 there, so FFI
      # mistakes only show on aarch64. A type check needs no cross linker.
      - name: Type-check for aarch64
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo check --workspace --locked --target aarch64-unknown-linux-gnu
      # The renderer's frame budget: only meaningful optimised, so it's
      # ignored in the debug test run.
      - name: Performance budgets
        run: cargo test --release --locked -- --ignored budget_ --test-threads=1
      - name: Scripts parse
        run: |
          python3 -m py_compile bench/calcbench.py
          bash -n bench/run
          sh -n install.sh
      # A staged install and uninstall of the release build, as the
      # PKGBUILD does it, and the installed desktop entry checked.
      - name: Install and uninstall
        run: |
          apt-get install -y -qq --no-install-recommends desktop-file-utils >/dev/null
          stage=$(mktemp -d)
          PREFIX=/usr DESTDIR="$stage" BIN=target/release/alias-calc \
            LIB=target/release-a11y/libalias_calc_a11y.so ./install.sh
          desktop-file-validate "$stage/usr/share/applications/com.aliasproject.calc.desktop"
          test "$(find "$stage" -type f | wc -l)" -eq 6
          grep -qx 'Exec="/usr/bin/alias-calc"' "$stage/usr/share/applications/com.aliasproject.calc.desktop"
          PREFIX=/usr DESTDIR="$stage" ./install.sh uninstall
          test "$(find "$stage" -type f | wc -l)" -eq 0
          rm -rf "$stage"
      - name: Hand the workspace back to the runner user
        if: always()
        run: chown -R 1001:1001 "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
