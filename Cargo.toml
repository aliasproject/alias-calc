[package]
name = "alias-calc"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
description = "A tiny, instant calculator for aliasOS"
publish = false

[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
