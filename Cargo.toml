[package]
name = "alias-calc"
version = "0.1.1"
edition = "2024"
license = "LicenseRef-Proprietary"
description = "A tiny, instant calculator for aliasOS"
publish = false

[dependencies]
fontdue = { version = "0.9", default-features = false, features = ["std", "simd"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "pipe"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[workspace]
# The screen reader bridge, a library loaded only when one is running.
members = [".", "a11y"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

# The screen reader library (a11y/) is packaged from this profile: it's loaded
# only while Orca runs, so size matters more than speed there. "z" takes it
# from 2.7 to 1.9 MB. The binary keeps `release`.
[profile.release-a11y]
inherits = "release"
opt-level = "z"
